{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<section class="section">
  <div class="empty-state err-state">
    <div class="err-code">404</div>
    <i class="fa-solid fa-circle-question"></i>
    <h2>{{ message or "This page doesn't exist." }}</h2>
    <p>The page you're looking for was moved, deleted, or never existed.</p>
    <div class="hero-actions" style="justify-content:center">
      <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="fa-solid fa-house"></i> Back Home</a>
      <a href="{{ url_for('dashboard') }}" class="btn btn-outline"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
    </div>
  </div>
</section>
{% endblock %}
